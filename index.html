<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ГРАВИТОН · ПЯТЬ КУБОВ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05070a;color:#e8f0f5;font-family:'Segoe UI',sans-serif;touch-action:none}
canvas{display:block}#gl{position:fixed;inset:0}
#rot{position:fixed;inset:0;z-index:900;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#05070a;text-align:center;padding:24px}
#rot.on{display:flex}.ph{width:60px;height:104px;border:3px solid #ff8a1e;border-radius:11px;animation:tn 2.4s infinite}
@keyframes tn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot b{color:#ff8a1e;letter-spacing:.2em;font-size:15px}#rot span{color:#8494a0;font-size:12px;max-width:300px}
#menu{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(5,7,10,.46),rgba(5,7,10,.85))}
#menu.off{display:none}
#mtop{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid rgba(255,138,30,.34);background:rgba(7,11,16,.95)}
#logo{font-size:22px;font-weight:900;letter-spacing:.17em;color:#ff8a1e;text-shadow:0 0 12px #ff8a1e}
#logo small{display:block;font-size:7px;letter-spacing:.4em;color:#8494a0}
#cred{margin-left:auto;display:flex;align-items:center;gap:7px;background:rgba(255,196,107,.16);border:1px solid rgba(255,196,107,.5);padding:6px 14px;border-radius:3px;font-weight:900;color:#ffc46b;font-size:14px}
#mnav{display:flex;gap:2px;padding:0 14px;background:rgba(7,11,16,.7);border-bottom:1px solid #263440}
.nv{padding:10px 20px;font-size:11px;letter-spacing:.2em;font-weight:800;color:#8494a0;border-bottom:2px solid transparent;transition:.15s}
.nv:hover{color:#e8f0f5}.nv.on{color:#ffc46b;border-bottom-color:#ff8a1e;background:rgba(255,138,30,.15)}
#mmain{flex:1;overflow-y:auto;padding:16px}
.view{display:none;animation:vi .3s}.view.on{display:block}
@keyframes vi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.vt{font-size:20px;letter-spacing:.3em;color:#ffc46b;text-align:center;margin-bottom:14px;font-weight:900}
#cubeGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.cube{position:relative;border:1px solid #263440;border-top:3px solid var(--cc);background:linear-gradient(155deg,rgba(16,26,35,.95),rgba(9,14,20,.92));border-radius:4px;text-align:left;transition:.18s;overflow:hidden}
.cube .art{height:70px;position:relative;background:linear-gradient(160deg,#12202a,#070b10)}
.cube .art canvas{position:absolute;inset:0;width:100%;height:100%}
.cube .body{padding:11px 13px}
.cube:hover:not(.lock){border-color:var(--cc);box-shadow:0 0 26px -6px var(--cc);transform:translateY(-2px)}
.cube.sel{border-color:var(--cc);box-shadow:0 0 30px -6px var(--cc)}
.cube.lock{opacity:.44;cursor:not-allowed}
.cube .num{font-size:8px;letter-spacing:.34em;color:var(--cc);font-weight:800}
.cube h3{font-size:15px;letter-spacing:.13em;margin:3px 0 5px;color:#fff;font-weight:900}
.cube p{font-size:10px;line-height:1.55;color:#8494a0;margin-bottom:7px;min-height:32px}
.cube .mech{display:inline-block;font-size:8px;letter-spacing:.12em;padding:3px 7px;border:1px solid var(--cc);color:var(--cc);border-radius:2px;margin-bottom:7px;font-weight:800}
.cube .meta{display:flex;gap:8px;font-size:9px;color:#9aa6b0;flex-wrap:wrap}.cube .meta b{color:var(--cc)}
.cube .bst{margin-top:7px;padding-top:6px;border-top:1px solid #263440;font-size:9px;color:#8494a0}.cube .bst b{color:#ff2f52}
.cube .done{position:absolute;top:8px;right:8px;width:18px;height:18px;color:#a6ff3d;z-index:2}
.play{display:block;width:100%;max-width:430px;margin:0 auto;padding:15px;background:linear-gradient(135deg,#ff8a1e,#a04a06);color:#08060a;font-size:15px;letter-spacing:.24em;font-weight:900;border-radius:3px;box-shadow:0 0 28px rgba(255,138,30,.45)}
.play:hover{filter:brightness(1.14)}.play:disabled{opacity:.4;filter:grayscale(1)}
.hintline{text-align:center;font-size:10px;color:#8494a0;margin-top:10px;line-height:1.7}.hintline b{color:#22e8d8}
#shopGrid,#engGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.item{padding:12px 14px;border:1px solid #263440;border-top:2px solid var(--ic);background:linear-gradient(155deg,rgba(16,26,35,.95),rgba(9,14,20,.92));border-radius:4px}
.item .ih{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.item .ih .ic{width:24px;height:24px;color:var(--ic);flex-shrink:0}
.item .ih b{font-size:12px;letter-spacing:.12em;font-weight:900}
.item .ih .lv{margin-left:auto;font-size:9px;color:var(--ic);font-weight:800}
.item p{font-size:10px;color:#8494a0;line-height:1.6;margin-bottom:8px;min-height:30px}
.strow{display:flex;justify-content:space-between;font-size:10px;color:#9aa6b0;padding:2px 0}.strow b{color:#22e8d8}
.ibar{height:6px;background:#070b0f;border:1px solid #263440;margin:7px 0;position:relative;overflow:hidden;border-radius:2px}
.ibar u{position:absolute;inset:1px;transform-origin:left;text-decoration:none;background:var(--ic);transition:transform .3s}
.buy{width:100%;padding:8px;font-size:10px;font-weight:900;letter-spacing:.14em;border:1px solid var(--ic);color:var(--ic);background:transparent;border-radius:2px;transition:.15s}
.buy:hover:not(:disabled){background:var(--ic);color:#000}
.buy:disabled{opacity:.32;cursor:not-allowed}.buy.owned{border-color:#a6ff3d;color:#a6ff3d}
#hud{position:fixed;inset:0;z-index:22;pointer-events:none;display:none}#hud.on{display:block}
#mm{position:absolute;left:8px;top:7px;width:calc(100px*var(--k,1));height:calc(100px*var(--k,1));border:1px solid rgba(255,138,30,.55);background:rgba(5,7,10,.82);border-radius:50%}
#top{position:absolute;top:7px;left:50%;transform:translateX(-50%);text-align:center;width:min(430px,46vw)}
#cubeN{font-size:12px;letter-spacing:.32em;color:#fff;font-weight:800;text-shadow:0 0 10px var(--acc,#ff8a1e)}
#obj{font-size:10px;letter-spacing:.14em;color:#22e8d8;margin-top:2px;font-weight:700}
#wav{display:flex;gap:3px;justify-content:center;margin-top:4px}
.wd{width:12px;height:3px;background:#22303c;border-radius:1px}.wd.dn{background:#a6ff3d}.wd.on{background:#ff8a1e;box-shadow:0 0 6px #ff8a1e}.wd.bs{background:#ff2f52;width:18px}
#scr{position:absolute;top:7px;right:86px;text-align:right}
#scrn{font-size:18px;font-weight:900;color:#ffc46b;font-variant-numeric:tabular-nums}
#cmb{font-size:9px;color:#ff45e0;font-weight:800;height:12px}
#boss{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:min(480px,62vw);display:none}
#boss.on{display:block}
#bossN{text-align:center;font-size:11px;letter-spacing:.3em;color:#ff2f52;font-weight:900;text-shadow:0 0 12px #ff2f52;margin-bottom:4px}
#bossB{height:12px;background:#0a0508;border:1px solid #ff2f52;position:relative;overflow:hidden;box-shadow:0 0 18px rgba(255,47,82,.4)}
#bossF{position:absolute;inset:1px;transform-origin:left;background:linear-gradient(90deg,#8f0f22,#ff2f52,#ff45e0);transition:transform .2s}
#bossP{text-align:center;font-size:8px;letter-spacing:.24em;color:#ffc46b;margin-top:3px}
#vit{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(48px*var(--k,1));width:calc(212px*var(--k,1))}
.vr{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.vr .ic{width:calc(13px*var(--k,1));height:calc(13px*var(--k,1));flex-shrink:0}
.vb{flex:1;height:calc(8px*var(--k,1));background:#070b0f;border:1px solid #263440;position:relative;overflow:hidden}
.vb u{position:absolute;inset:1px;transform-origin:left;text-decoration:none;transition:transform .12s}
#hpf{background:linear-gradient(90deg,#a8172c,#ff2f52,#ff8a1e)}#arf{background:linear-gradient(90deg,#0a6b64,#22e8d8)}
.vr b{font-size:calc(9.5px*var(--k,1));min-width:26px;text-align:right;font-weight:800}
#wps{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;display:flex;gap:calc(4px*var(--k,1));pointer-events:auto;z-index:6}
.wp{width:calc(44px*var(--k,1));height:calc(34px*var(--k,1));background:rgba(9,13,18,.92);border:1px solid #263440;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:2px;color:#8494a0}
.wp .ic{width:calc(17px*var(--k,1));height:calc(17px*var(--k,1))}.wp s{text-decoration:none;font-size:calc(6.5px*var(--k,1));margin-top:1px}
.wp.on{border-color:#ff8a1e;background:rgba(255,138,30,.24);box-shadow:0 0 12px rgba(255,138,30,.5);transform:translateY(-3px);color:#ffc46b}
.wp.dry{opacity:.3}
#ammo{position:absolute;right:10px;bottom:calc(212px*var(--k,1));text-align:right;font-size:calc(19px*var(--k,1));font-weight:900;color:#fff;text-shadow:0 0 10px #ff8a1e}
#ammo small{font-size:calc(10px*var(--k,1));color:#8494a0}
#heat{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(88px*var(--k,1));width:calc(140px*var(--k,1));display:none;text-align:center}
#heat s{text-decoration:none;font-size:calc(7px*var(--k,1));letter-spacing:.2em;color:#8494a0}
#heatb{height:calc(5px*var(--k,1));background:#070b0f;border:1px solid #263440;margin-top:2px}
#heatf{height:100%;background:linear-gradient(90deg,#22e8d8,#ff8a1e);transform-origin:left;transform:scaleX(0)}
#hint{position:absolute;left:50%;top:27%;transform:translateX(-50%);max-width:min(410px,60vw);background:rgba(9,13,18,.94);border-left:3px solid #22e8d8;padding:8px 14px;font-size:11px;line-height:1.5;text-align:center;opacity:0;transition:.3s}
#hint.on{opacity:1}#hint b{color:#22e8d8}
#ban{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.9);text-align:center;opacity:0;transition:.3s}
#ban.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#ban b{display:block;font-size:36px;font-weight:900;letter-spacing:.2em;color:#ff2f52;text-shadow:0 0 24px #ff2f52}
#ban s{text-decoration:none;font-size:9px;letter-spacing:.3em;color:#ffc46b}
#cr{position:fixed;top:50%;left:50%;width:0;height:0;z-index:24;display:none;--s:7px;--c:#ff8a1e}
#cr i{position:absolute;background:var(--c);box-shadow:0 0 4px #000}
#cr .t{width:2px;height:7px;left:-1px;top:calc(-9px - var(--s))}#cr .b{width:2px;height:7px;left:-1px;top:calc(2px + var(--s))}
#cr .l{height:2px;width:7px;top:-1px;left:calc(-9px - var(--s))}#cr .r{height:2px;width:7px;top:-1px;left:calc(2px + var(--s))}
#cr.hot{--c:#ff2f52}
#hm{position:fixed;top:50%;left:50%;z-index:25;opacity:0;width:24px;height:24px;transform:translate(-50%,-50%);transition:.08s;pointer-events:none}
#hm i{position:absolute;width:10px;height:2.5px;background:#fff;border-radius:2px}
#hm i:nth-child(1){transform:rotate(45deg);left:0;top:3px}#hm i:nth-child(2){transform:rotate(-45deg);left:0;top:18px}
#hm i:nth-child(3){transform:rotate(-45deg);left:14px;top:3px}#hm i:nth-child(4){transform:rotate(45deg);left:14px;top:18px}
#hm.kill i{background:#ff2f52;height:3.5px;width:13px}
#ind,#lbl,#dmgd{position:fixed;inset:0;pointer-events:none;display:none}
#ind{z-index:23}#lbl{z-index:24}#dmgd{z-index:23}
.fx{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;transition:.14s}
#vg{background:radial-gradient(circle,transparent 34%,rgba(255,20,50,.75))}
#lw{background:radial-gradient(circle,transparent 42%,rgba(255,15,40,.5));animation:lp 1s infinite}
@keyframes lp{50%{opacity:.38}}
#fl{background:radial-gradient(circle,rgba(34,232,216,.4),transparent 66%);transition:.3s}
#cold{background:radial-gradient(circle,transparent 30%,rgba(127,216,255,.3));transition:.5s}
#tst{position:fixed;bottom:calc(112px*var(--k,1));left:50%;transform:translateX(-50%);z-index:26;font-size:12px;letter-spacing:.18em;color:#a6ff3d;text-shadow:0 0 10px #a6ff3d;opacity:0;transition:.26s;text-align:center;width:74vw;font-weight:800;pointer-events:none}
.pop{position:fixed;left:50%;top:41%;z-index:26;pointer-events:none;font-size:16px;font-weight:900;text-shadow:0 2px 7px #000;animation:pp .9s ease-out forwards}
@keyframes pp{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-50px) scale(.95)}}
.dn{position:fixed;z-index:26;pointer-events:none;font-size:13px;font-weight:900;text-shadow:0 2px 5px #000;animation:da .65s ease-out forwards}
@keyframes da{0%{opacity:0;transform:translate(-50%,0) scale(.7)}22%{opacity:1;transform:translate(-50%,-8px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-32px) scale(.9)}}
#topb{position:fixed;top:7px;right:7px;z-index:400;display:flex;gap:5px}
.ib{width:34px;height:34px;background:rgba(11,17,24,.92);border:1px solid #263440;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#e8f0f5}
.ib .ic{width:17px;height:17px}.ib:hover{border-color:#22e8d8;color:#22e8d8}
#tc{position:fixed;inset:0;z-index:20;display:none;pointer-events:none}#tc.on{display:block}
#look{position:absolute;inset:0;pointer-events:auto;z-index:1}
#joy{position:absolute;left:16px;bottom:14px;width:calc(126px*var(--k,1));height:calc(126px*var(--k,1));border-radius:50%;pointer-events:auto;z-index:4;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(9,13,18,.45));border:2px solid rgba(255,255,255,.24);box-shadow:0 4px 20px rgba(0,0,0,.5)}
#joy::before{content:'';position:absolute;inset:18%;border:1px dashed rgba(255,255,255,.13);border-radius:50%}
#knob{position:absolute;left:50%;top:50%;width:calc(52px*var(--k,1));height:calc(52px*var(--k,1));margin:calc(-26px*var(--k,1)) 0 0 calc(-26px*var(--k,1));border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.96),rgba(190,205,220,.72) 48%,rgba(115,135,150,.62));box-shadow:0 3px 12px rgba(0,0,0,.55)}
.cb{position:absolute;pointer-events:auto;border-radius:50%;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:rgba(12,18,24,.45);border:2px solid rgba(255,255,255,.3);z-index:4;padding:0;transition:transform .07s,background .1s;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.cb.held{transform:scale(.92);background:rgba(255,255,255,.3)}
.cb .ic{width:calc(24px*var(--k,1));height:calc(24px*var(--k,1))}
.cb s{text-decoration:none;font-size:calc(6.5px*var(--k,1));letter-spacing:.08em;opacity:.8;margin-top:2px}
#tfire{right:16px;bottom:16px;width:calc(104px*var(--k,1));height:calc(104px*var(--k,1));border-color:rgba(255,138,30,.8);background:radial-gradient(circle at 36% 30%,rgba(255,138,30,.45),rgba(255,60,20,.22));box-shadow:0 0 24px rgba(255,138,30,.3)}
#tfire .ic{width:calc(38px*var(--k,1));height:calc(38px*var(--k,1))}
#tjump{right:128px;bottom:20px;width:calc(66px*var(--k,1));height:calc(66px*var(--k,1));border-color:rgba(166,255,61,.6);background:rgba(166,255,61,.14)}
#tgrav{right:20px;bottom:130px;width:calc(74px*var(--k,1));height:calc(74px*var(--k,1));border-color:rgba(139,92,255,.75);background:radial-gradient(circle at 36% 30%,rgba(139,92,255,.4),rgba(80,40,160,.2));box-shadow:0 0 20px rgba(139,92,255,.3)}
#tgrav svg.ring{position:absolute;inset:-3px;width:calc(100% + 6px);height:calc(100% + 6px);transform:rotate(-90deg);pointer-events:none}
#tgrav circle{fill:none;stroke:#fff;stroke-width:4;opacity:.9}
#tgrav.cd{filter:grayscale(.85) brightness(.55)}
#tdodge{right:106px;bottom:98px;width:calc(64px*var(--k,1));height:calc(64px*var(--k,1));border-color:rgba(34,232,216,.65);background:rgba(34,232,216,.16)}
#tdodge.cd{filter:grayscale(.8) brightness(.6)}
#trun{left:24px;bottom:150px;width:calc(64px*var(--k,1));height:calc(64px*var(--k,1));border-color:rgba(255,196,107,.6);background:rgba(255,196,107,.14)}
#trun.act{background:rgba(255,196,107,.45);border-color:#ffc46b;box-shadow:0 0 18px rgba(255,196,107,.5)}
#trl{left:98px;bottom:158px;width:calc(54px*var(--k,1));height:calc(54px*var(--k,1));border-color:rgba(255,255,255,.3)}
.scr{position:fixed;inset:0;z-index:340;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(20,32,44,.9),rgba(5,7,10,.97))}
.scr.off{display:none}
.panel{width:min(520px,94vw);max-height:94vh;overflow-y:auto;padding:22px;background:linear-gradient(150deg,rgba(16,26,35,.97),rgba(9,14,20,.95));border:1px solid #263440;border-top:2px solid #ff8a1e;box-shadow:0 20px 60px rgba(0,0,0,.75)}
.panel h1{font-size:40px;font-weight:900;letter-spacing:.16em;text-align:center;line-height:1}
.sub{text-align:center;font-size:8px;letter-spacing:.4em;color:#8494a0;margin:7px 0 16px}
.res{font-size:12px;color:#c3cdd5;line-height:1.9;text-align:center;margin-bottom:14px}.res b{color:#22e8d8}.res .b2{display:block;font-size:38px;color:#ff8a1e;font-weight:900}
.row{display:flex;gap:7px;margin-top:8px}
.bt{flex:1;padding:12px;border:1px solid #ff8a1e;color:#ffc46b;background:rgba(255,138,30,.12);font-size:12px;letter-spacing:.18em;font-weight:800;border-radius:3px}
.bt:hover{background:#ff8a1e;color:#000}.bt.gh{border-color:#263440;color:#e8f0f5;background:rgba(18,26,35,.9)}
#err{position:fixed;inset:0;z-index:999;background:#0a0508;display:none;align-items:center;justify-content:center;flex-direction:column;color:#ff2f52;padding:22px;text-align:center}
#err p{color:#c3cdd5;font-size:11px;max-width:600px;line-height:1.8;margin-top:10px;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="rot"><div class="ph"></div><b>ПОВЕРНИТЕ УСТРОЙСТВО</b><span>Игра работает только горизонтально.</span></div>
<div id="menu">
 <div id="mtop"><div id="logo">ГРАВИТОН<small>ПЯТЬ КУБОВ · ПРОТОКОЛ 7</small></div><div id="cred"></div></div>
 <div id="mnav"><button class="nv on" data-v="cubes">КУБЫ</button><button class="nv" data-v="shop">АРСЕНАЛ</button><button class="nv" data-v="eng">ИНЖЕНЕР</button></div>
 <div id="mmain">
  <div class="view on" id="v-cubes"><div class="vt">ВЫБЕРИ СЕКТОР</div><div id="cubeGrid"></div>
   <button class="play" id="bPlay">НАЧАТЬ ШТУРМ</button>
   <div class="hintline">14 волн + <b>БОСС</b> на 15-й. У каждого куба своя карта, враги, механика и музыка.</div></div>
  <div class="view" id="v-shop"><div class="vt">АРСЕНАЛ · МАГАЗИН</div><div id="shopGrid"></div></div>
  <div class="view" id="v-eng"><div class="vt">УЛУЧШЕНИЯ ИНЖЕНЕРА</div><div id="engGrid"></div></div>
 </div>
</div>
<div id="hud"><canvas id="mm" width="150" height="150"></canvas>
 <div id="top"><div id="cubeN">КУБ</div><div id="obj"></div><div id="wav"></div></div>
 <div id="scr"><div id="scrn">0</div><div id="cmb"></div></div><div id="haz"></div>
 <div id="boss"><div id="bossN">БОСС</div><div id="bossB"><div id="bossF"></div><i style="left:33%"></i><i style="left:66%"></i></div><div id="bossP"></div></div>
 <div id="vit"><div class="vr"><span class="ic" id="icHp"></span><div class="vb"><u id="hpf"></u></div><b id="hpn">100</b></div>
